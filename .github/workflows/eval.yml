name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    name: Ragas Evaluation
    runs-on: ubuntu-latest

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      WEAVIATE_URL: http://localhost:8080
      REDIS_URL: redis://localhost:6379

    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: "none"
          PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
        options: >-
          --health-cmd "wget --no-verbose --spider http://localhost:8080/v1/.well-known/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

      # Ragas eval requires a populated Weaviate corpus (~36k chunks) which
      # cannot be ingested in CI within a reasonable time budget. Run manually
      # with: uv run python scripts/evaluate.py --output data/eval/scores.json
      # and commit the resulting scores.json as the record of eval results.
