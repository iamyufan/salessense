[project]
name = "salessense"
version = "0.1.0"
description = "Production-grade RAG system over sales call transcripts, deal notes, and playbooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM & Embeddings
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",

    # Vector Store
    "weaviate-client>=4.9.0",

    # Reranking
    "cohere>=5.0.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",

    # Data & Ingestion
    "datasets>=3.0.0",
    "pypdf>=5.0.0",
    "tiktoken>=0.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",

    # Eval
    "ragas>=0.2.0",
    "dspy-ai>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salessense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
